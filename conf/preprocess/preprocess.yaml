defaults:
  - size: small
  - dataset_path: biax_longer
  - normalizer: z_isotropic
  - features: all # contains all features to be toggled on/off
  - _self_

device: cpu
dt: 0.08
seed: 42
time_discretization_method: "second_order_central" # "newmark" | "second_order_central"

# Edge topology augmentation (offline). Ratios in [0, 1].
# k_hop: non-negative int adds edges for pairs within that hop distance on the mesh, or "fully connected" for a complete graph (incompatible with random_offline > 0 and add_wall_edges).
edge_augmentation:
  k_hop: 0
  random_offline: 0.0
  add_wall_edges: null # null | "all" | "pseudo_random"
  wall_border_percentage: 0.0
  wall_internal_percentage: 0.0

hydra:
  run:
    dir: hydra/outputs/preprocess/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: hydra/multirun/preprocess/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false