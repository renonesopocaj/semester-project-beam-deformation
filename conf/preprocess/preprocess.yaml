defaults:
  - size: small
  - dataset_path: biax_longer
  - normalizer: z_isotropic
  - features: all # contains all features to be toggled on/off
  - edge_augmentation: default
  - _self_

device: cpu
dt: 0.08
seed: 42
low_memory: false # if true, stream the most memory-heavy preprocessing work per trajectory
time_discretization_method: "second_order_central" # "newmark" | "second_order_central"
# Supervised target layout:
#   "von_mises"   -> y = [acc(3), vm(1)] of shape (N, 4)  (current default)
#   "full_stress" -> y = [acc(3), sig6(6)] of shape (N, 9), with sig6 = [sxx, syy, szz, sxy, sxz, syz]
# Aux per-Data attributes (y_sig6_t, y_von_mises, von_mises_log) are always saved.
target_mode: "full_stress"

hydra:
  run:
    dir: hydra/outputs/preprocess/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: hydra/multirun/preprocess/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false
