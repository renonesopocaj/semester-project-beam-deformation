name_features: "nonlin"
# non_linear.yaml Idea: all linear relationships quantity_i - quantity_j are turned off and left to the message passing
# Processing target von mises
mises_log: true
# Both edge and node
enable_absolute_pos: false # with this off, only displacement is left
enable_past_history: true # controls if t-1 features are given, for displacement u and abs position x and stretch ratio
# Node
enable_node_norms: false
# Edge linear and vectorial
enable_edge_velocity: false
enable_force_edge: false
enable_displ_edge: false
enable_abs_pos_edge: false
enable_abs_rest_pos_edge: false
# Edge norms
enable_abs_pos_edge_norm: true # note: displacement norm is NOT necessary (it's the same)
enable_rest_pos_edge_norm: true
enable_force_edge_norm: true
enable_edge_velocity_norm: true
# Stretch (edge)
enable_stretch_edge: true
# Rotation (edge)
enable_rotation_angle: true
