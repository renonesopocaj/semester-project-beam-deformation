name_features: "nostretch_abspos_nonlin"
# Processing target von mises
mises_log: true
# Both edge and node
enable_absolute_pos: true # needs also additional enabler for edges
enable_past_history: true
# Node
enable_velocity_node: true
enable_displacement_node: true
enable_force_node: true
enable_rest_pos_node: true
enable_node_norms: false # does not report norms for absolute positions x and rest_pos
# Edge
enable_edge_velocity: false
enable_force_edge: false
enable_displ_edge: false
enable_abs_pos_edge: false
enable_abs_rest_pos_edge: false
# Edge norms
enable_abs_pos_edge_norm: true # note: displacement norm is not necessary (it's the same)
enable_rest_pos_edge_norm: true
enable_force_edge_norm: true
enable_edge_velocity_norm: true
# Stretch (edge)
enable_stretch_edge: false
# Rotation (edge)
enable_rotation_angle: false