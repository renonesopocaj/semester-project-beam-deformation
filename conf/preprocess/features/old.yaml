name_features: "old"
# Processing target von mises
mises_log: true
# Both edge and node
enable_absolute_pos: true # needs also additional enabler for edges
enable_past_history: false
# Node
enable_node_norms: false
# Edge
enable_edge_velocity: false
enable_force_edge: false
enable_displ_edge: true
enable_abs_pos_edge: true
enable_abs_rest_pos_edge: true
# Edge norms
enable_abs_pos_edge_norm: false # note: displacement norm is not necessary (it's the same)
enable_rest_pos_edge_norm: false
enable_force_edge_norm: false
enable_edge_velocity_norm: false
# Stretch (edge)
enable_stretch_edge: false
# Rotation (edge)
enable_rotation_angle: false