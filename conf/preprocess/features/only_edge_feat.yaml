name_features: "only_edge_feat1"
# noabspos_yesedge.yaml Idea: all edges on, all edge norms on, no stretch/rotation, no absolute position
# Processing target von mises
mises_log: true
# Both edge and node
enable_absolute_pos: false # needs also additional enabler for edges
enable_past_history: true
# Node
enable_displacement_node: false
enable_rest_pos_node: false
enable_force_node: false
enable_velocity_node: false
enable_node_norms: false # does not report norms for absolute positions x and rest_pos
# Edge
enable_edge_velocity: true
enable_force_edge: true
enable_displ_edge: true
enable_abs_pos_edge: true
enable_abs_rest_pos_edge: true
# Edge norms
enable_abs_pos_edge_norm: true # note: displacement norm is not necessary (it's the same)
enable_rest_pos_edge_norm: true
enable_force_edge_norm: true
enable_edge_velocity_norm: true
# Stretch (edge)
enable_stretch_edge: false
# Rotation (edge)
enable_rotation_angle: false