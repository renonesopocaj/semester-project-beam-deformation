defaults:
  - dataset: large # size only: large | medium | small
  - numerical: default # apply log to von mises vs do not apply
  - paths: single_direction_beam # rotated | single_direction_beam
  - normalizer: z_anisotropic
  - features: displacement # which feature augmentation use
  - _self_

hydra:
  run:
    dir: hydra/outputs/eda/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: hydra/multirun/eda/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false
