# Hyperparameter study driver: edit `sweeps` below to change what is swept (no code changes).
# Each sweep runs every option once (grid); the override set that wins is carried into the next sweep.
# Training composes `conf/train/{train_compose_config}.yaml` (default: train_default_hyperopt).
# `train_default_hyperopt.yaml` mirrors `train.yaml` (full defaults + top-level fields); edit that
# file for hyperopt baselines.
# Override on CLI, e.g. `train_compose_config=train` to use `train.yaml` as the compose root instead.

train_compose_config: train_sanity_sweep
study_name: hp_opt_${now:%Y-%m-%d_%H-%M-%S}
output_dir: hyperparam_outputs/${study_name}
# Minimize this (must match ModelCheckpoint monitor in train); value comes from checkpoint best score.
optimization_metric: val/overall_relative_mae
# Axes for the Pareto plot (keys in the dict returned after val+test; use final_test/... if you prefer test).
pareto_metric_source: test
pareto_x_metric: final_test/acc_all_rel_mae
pareto_y_metric: final_test/stress_rel_mae
wandb_project: beam_deformation
wandb_offline: true
base_dir: dataset # NOTE: if it's on slurm it's "/scratch/izar/senoner/dataset" else "dataset"

sweeps:
  - name: features
    fixed_overrides:
      - noise=no_noise
    options:
      - label: all
        overrides:
          - data.dataset_dir=${base_dir}/processed/biax_longer/z_isotr_centr_all/small
      - label: nonlin
        overrides:
          - data.dataset_dir=${base_dir}/processed/single_longer/z_isotr_centr_all/small

  - name: noise
    fixed_overrides: []
    options:
      - label: offline_1e-4
        overrides:
          - noise.noise_scale_train=0.0001
          - noise.noise_per_epoch=false
      - label: offline_5e-4
        overrides:
          - noise.noise_scale_train=0.0005
          - noise.noise_per_epoch=true

  - name: gamma
    fixed_overrides: []
    options:
      - label: g_0.1
        overrides:
          - noise.noise_gamma=0.1
      - label: g_0.05
        overrides:
          - noise.noise_gamma=0.05

hydra:
  run:
    dir: hydra/outputs/hyperparam/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
