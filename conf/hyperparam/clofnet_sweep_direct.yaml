# Hyperparameter study driver: ClofNet baseline (single option); extend `options` to sweep extras.
# Training composes `conf/train/{train_compose_config}.yaml`.

train_compose_config: train_sweep_defaults
study_name: hp_opt_clofnet_direct_${now:%Y-%m-%d_%H-%M-%S}
output_dir: hyperparam_outputs/${study_name}
optimization_metric: overall_abs_mae
pareto_x_metric:
  - final_test/acc_all_rel_mae
  - final_test/acc_all_abs_mae
pareto_y_metric:
  - final_test/stress_rel_mae
  - final_test/stress_abs_mae
wandb_project: beam_deformation
wandb_offline: true
base_dir: /scratch/izar/senoner/dataset

sweeps:
  - name: clofnet
    fixed_overrides:
      - noise=noise_per_epoch_noprev
    options:
      - label: clofnet_direct_H192_L11_softeps_uframsource_LN
        overrides:
          - model=clofnet_direct_H192_L11_softeps_uframsource_LN
      - label: clofnet_direct_H192_L11_softeps_uframesource_LN_recurrent
        overrides:
          - model=clofnet_direct_H192_L11_softeps_uframesource_LN_recurrent
      - label: clofnet_direct_L11_hardeps_uframesource_LN
        overrides:
          - model=clofnet_direct_L11_hardeps_uframesource_LN
      - label: clofnet_direct_L11_softeps_uframesource_LN
        overrides:
          - model=clofnet_direct_L11_softeps_uframesource_LN
      - label: clofnet_direct_L11_softeps_uframesource_LN_tanh
        overrides:
          - model=clofnet_direct_L11_softeps_uframesource_LN_tanh
      - label: clofnet_direct_L11_uframesource_LN_includetm1
        overrides:
          - model=clofnet_direct_L11_uframesource_LN_includetm1
      - label: clofnet_L11_GOAT
        overrides:
          - model=clofnet_L11_GOAT

hydra:
  run:
    dir: hydra/outputs/hyperparam/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
