# Hyperparameter study: MGN output-head (von Mises vs full-stress target) sweep.
# Training composes `conf/train/{train_compose_config}.yaml`.
#
# IMPORTANT — dataset requirements:
#   - von Mises options use the default data config (z_isotr_centr_nonlin/medium).
#   - full_stress options switch to `data=full_stress` (z_isotr_centr_nonlin_fs/medium).
#     That dataset must be preprocessed first:
#       python -m src.gnn.preprocess features=nonlin target_mode=full_stress
#   - On SLURM replace `data=full_stress` with `data=slurm_full_stress` in each full_stress option.

train_compose_config: train_sweep_defaults
study_name: hp_opt_mgn_heads_${now:%Y-%m-%d_%H-%M-%S}
output_dir: hyperparam_outputs/${study_name}
optimization_metric: overall_abs_mae
pareto_x_metric:
  - final_test/acc_all_rel_mae
  - final_test/acc_all_abs_mae
pareto_y_metric:
  - final_test/stress_rel_mae
  - final_test/stress_abs_mae
wandb_project: beam_deformation
wandb_offline: true
base_dir: dataset

sweeps:
  - name: mgn_head_sweep
    fixed_overrides:
      - noise=noise_per_epoch_noprev
      - loss.loss_type="mae"
      - model=mgn_H192_L15
    options:
      - label: mgn_vonmises
        overrides:
          - target_mode="von_mises"
      - label: mgn_fullstress_w1.0
        overrides:
          - data=full_stress
          - target_mode="full_stress"
          - full_stress_loss_mode="components"
          - stress_weight=1.0
      - label: mgn_fullstress_w0.5
        overrides:
          - data=full_stress
          - target_mode="full_stress"
          - full_stress_loss_mode="components"
          - stress_weight=0.5
      - label: mgn_fullstress_vonmisesloss_w1.0
        overrides:
          - data=full_stress
          - target_mode="full_stress"
          - full_stress_loss_mode="components_plus_vm"
          - stress_weight=1.0
          - full_stress_vm_weight=1.0
      - label: mgn_fullstress_vonmisesloss_w0.5
        overrides:
          - data=full_stress
          - target_mode="full_stress"
          - full_stress_loss_mode="components_plus_vm"
          - stress_weight=0.5
          - full_stress_vm_weight=0.5

hydra:
  run:
    dir: hydra/outputs/hyperparam/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
