# Idea of this config file: 1) f_y, f_z != 0 2) no constraints on geometry 3) a bit more data
output_root: "./fem_dataset_generation/triax_allgeoms/large"
only_json: False

defaults:
  # NL, NW, ND: fixed int (BoxMesh cells along L, W, D) or ratio: { ratio: r } -> max(1, round(dim * r)).
  NL: 8 # number of vertices along the direction L (length)
  NW: 4 # number of vertices along the direction L (width)
  ND: 4 # number of vertices along the direction L (depth)
  E: 1000.0
  nu: 0.3
  rho: 1.0
  eta_m: 0.01
  eta_k: 0.01
  alpha_m: 0.0
  alpha_f: 0.0
  total_time: 4.0
  cutoff_time_factor: 0.2
  num_steps: 50
  # Linear system: "mumps" (direct LU) or "krylov" (CG + AMG).
  linear_solver: krylov

val_fraction: 0.1
test_fraction: 0.1

# Training ranges — all force axes vary independently.
# Forces are combined via Cartesian product: 3 x 4 x 4 x 3 x 3 x 3 = 1296
train:
  force_x: { start: -0.7, stop: 0.7, n: 3 }
  force_y: { start: -0.7, stop: 0.7, n: 4 }
  force_z: { start: -0.7, stop: 0.7, n: 4 }
  lengths: { start: 0.05, stop: 1.0, n: 3 }
  widths:  { start: 0.05, stop: 1.0, n: 3 }
  depths: { start: 0.05, stop: 1.0, n: 3 }

# Out-of-distribution ranges used for test set generation.
# Each axis can have a "below" and/or "above" OOD sub-range.
# Omit a sub-key (or use {}) if the axis has no OOD range in that direction.
test_ood_ranges:
  force_x:
    below: { start: -1.2, stop: -0.8 }
    above: { start: 0.8, stop: 1.2 }
  force_y:
    below: { start: -1.2, stop: -0.8 }
    above: { start: 0.8, stop: 1.2 }
  force_z:
    below: { start: -1.2, stop: -0.8 }
    above: { start: 0.8, stop: 1.2 }
  lengths:
    below: { start: 0.01, stop: 0.04 }
    above: { start: 1.1, stop: 1.5 }
  widths:
    below: { start: 0.01, stop: 0.04 }
    above: { start: 1.1, stop: 1.5 }
  depths:
    below: { start: 0.01, stop: 0.04 }
    above: { start: 1.1, stop: 1.5 }

selected_trajs:
  selected_validation_trajectories: [1, 11, 24, 34, 46, 45, 76, 93, 111, 120]
  selected_test_trajectories: [3, 8, 12, 25, 32, 49, 51, 77, 84, 109, 124]
  selected_total_time: 32
  num_steps: 400
