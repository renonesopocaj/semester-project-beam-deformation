output_root: "./fem_dataset_generation/rotated"
only_json: true

defaults:
  D: 0.1
  NL: 8
  NW: 4
  ND: 4
  E: 1000.0
  nu: 0.3
  rho: 1.0
  eta_m: 0.01
  eta_k: 0.01
  alpha_m: 0.0
  alpha_f: 0.0
  total_time: 4.0
  cutoff_time_factor: 0.2
  num_steps: 50

val_fraction: 0.1
test_fraction: 0.1

# Training ranges — all force axes vary independently.
# Forces are combined via Cartesian product: 3 x 3 x 2 x 5 x 5 = 972
train:
  force_x: { start: 0.0, stop: 1.5, n: 3 }
  force_y: { start: 0.0, stop: 1.5, n: 3 }
  force_z: { start: 0.0, stop: 1.5, n: 3 }
  lengths: { start: 0.5, stop: 1.0, n: 6 }
  widths:  { start: 0.06, stop: 0.14, n: 6 }

# Out-of-distribution ranges used for test set generation.
test_ood_ranges:
  force_x: { start: 1.6, stop: 2.0 }
  force_y: { start: 1.6, stop: 2.0 }
  force_z: { start: 1.6, stop: 2.0 }
  lengths: { start: 1.1, stop: 1.5 }
  widths:  { start: 0.15, stop: 0.2 }
