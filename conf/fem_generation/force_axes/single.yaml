# Train / test OOD force ranges from large single_allgeoms (canonical); n comes from size.
name: single
train:
  force_x:
    start: 0.0
    stop: 0.0
  force_y:
    start: -1.1
    stop: 1.0
  force_z:
    start: 0.0
    stop: 0.0
test_ood_ranges:
  force_x: {}
  force_y:
    below:
      start: -1.5
      stop: -1.2
    above:
      start: 1.1
      stop: 1.5
  force_z:
    below:
      start: -1.0
      stop: -0.25
    above:
      start: 0.25
      stop: 1.0
