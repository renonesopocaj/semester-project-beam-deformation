output_root: "./fem_dataset_generation/rotated_fixedgeom_extrasoft"
only_json: False

defaults:
  # NL, NW, ND: fixed int (BoxMesh cells along L, W, D) or ratio: { ratio: r } -> max(1, round(dim * r)).
  NL: 8 # number of vertices along the direction L (length)
  NW: 4 # number of vertices along the direction L (width)
  ND: 4 # number of vertices along the direction L (depth)
  E: 1000.0
  nu: 0.01
  rho: 1.0
  eta_m: 0.01
  eta_k: 0.01
  alpha_m: 0.0
  alpha_f: 0.0
  total_time: 4.0
  cutoff_time_factor: 0.2
  num_steps: 50
  # Linear system: "mumps" (direct LU) or "krylov" (CG + AMG).
  linear_solver: krylov

val_fraction: 0.1
test_fraction: 0.1

# Training ranges — all force axes vary independently.
# Forces are combined via Cartesian product: 1 x 36 x 30 = 1080
# NOTE: no lengths, widths, depths
train:
  force_x: { start: 0.0, stop: 0.0, n: 1 }
  force_y: { start: -0.5, stop: 0.5, n: 36 }
  force_z: { start: -0.5, stop: 0.5, n: 30 }
  lengths: { start: 0.6, stop: 0.6, n: 1 }
  widths: { start: 0.05, stop: 0.05, n: 1 }
  depths: { start: 0.1, stop: 0.1, n: 1 }

# Out-of-distribution ranges used for test set generation.
# Each axis can have a "below" and/or "above" OOD sub-range.
# Omit a sub-key (or use {}) if the axis has no OOD range in that direction.
# NOTE: no lengths, widths, depths
test_ood_ranges:
  force_x: { }
  force_y:
    below: { start: -1.0, stop: -0.6 }
    above: { start: 0.6, stop: 1.0 }
  force_z:
    below: { start: -1.0, stop: -0.6 }
    above: { start: 0.6, stop: 1.0 }
  lengths: { }
  widths: { }
  depths: { }

selected_trajs:
  selected_validation_trajectories: [ 1, 11, 24, 34, 46, 45, 76, 93, 111, 120 ]
  selected_test_trajectories: [ 3, 8, 12, 25, 32, 49, 51, 77, 84, 109, 124 ]
  selected_total_time: 32
  num_steps: 400
