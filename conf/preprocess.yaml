defaults:
  - dataset: small
  - numerical: default
  - paths: single_direction_beam
  - _self_

split: train

hydra:
  run:
    dir: outputs/preprocess/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/preprocess/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false
