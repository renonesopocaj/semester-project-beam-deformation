computational:
  num_workers: 0
  batch_size: 16
  torch_compile: False
  profiling: False # disabled because it worsens computational efficiency
model:
  model_name: "MGN"
  num_messages: 8
  latent_dim: 128
training:
  training_type: "slurm"
  total_epochs: 100
  loss_type: "mse"
  resume_from: null
  checkpoint_interval: 20
validation:
  enable_val: True
  validation_interval: 1
  profile_loss_stress_vs_acceleration: False # disabled because it worsens computational efficiency
  enable_wandb_watch: False # disabled because it worsens computational efficiency
  enable_rollout_val: False
  log_test_media: True
data:
  dataset_dir: "dataset/processed/single_direction_beam/z_isotr_log_displace/large"
  train_dir: ${data.dataset_dir}/train
  val_dir: ${data.dataset_dir}/val
  test_dir: ${data.dataset_dir}/test
  stats_path: ${data.dataset_dir}/train/stats/stats.json
  preprocess_config_path: ${data.dataset_dir}/config.yaml
lr_scheduler:
  various
devices:
  devices: 1

seed: 42
use_wandb: true
initial_lr: 1e-3