model_name: "clofnet"
clofnet_variant: "recurrent" # recurrent | separate | extra_layer | direct
hidden_dim: 128
n_layers: 4
coords_weight: 1.0
recurrent: true
enable_norm_diff: true
tanh: false
attention_enable: false
clamp_enable: false
out_coord_mlp_dim: 3
embedding_edge_dim: 64
clofnet_activation: "silu"
leakyrelu_negative_slope: 0.2
