defaults:
  - computational: default
  - model: mgn_small
  - training: default # contains .total_epochs
  - noise: default
  - loss: default
  - validation: validation
  - data: default
  - lr_scheduler: step
  - residuals: default
  - devices: one_gpu
  - _self_

seed: 42
use_wandb: true
initial_lr: 1e-3
optimizer: adam

hydra:
  run:
    dir: hydra/outputs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: hydra/multirun/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false