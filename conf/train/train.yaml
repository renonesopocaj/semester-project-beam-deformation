defaults:
  - computational: default
  - model: meshgraphnet
  - training: training
  - validation: validation
  - data: default
  - lr_scheduler: step
  - _self_

seed: 42
use_wandb: true
initial_lr: 1e-3

hydra:
  run:
    dir: hydra/outputs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: hydra/multirun/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    chdir: false
